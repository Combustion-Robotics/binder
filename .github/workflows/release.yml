name: Build & release

# Push a tag like v1.0.1 to build Windows (x64, arm64) and Linux (x64, arm64) and publish a GitHub release.
# Run it by hand (Actions tab) to only build; the files are then attached to the run as artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Windows installers
        if: runner.os == 'Windows'
        run: |
          npx electron-builder --win --x64 --publish never
          npx electron-builder --win --arm64 --publish never
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --x64 --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: binder-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "Binder $GITHUB_REF_NAME" --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
